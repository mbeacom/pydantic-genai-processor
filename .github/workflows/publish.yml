name: 'Publish Release'

on:
  push:
    tags:
      - '*'

env:
  EXIT_ON_PUBLISH_FAILURE: 1

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
      discussions: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
        with:
          fetch-depth: 0

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098  # v7.3.1
        with:
          enable-cache: true
          python-version-file: .python-version

      - name: Verify Versions Match
        run: |
          TAG_VERSION=$(git describe HEAD --tags --abbrev=0)
          MODULE_VERSION=$(uv version)
          echo "Git Tag Version: $TAG_VERSION"
          echo "Python Module Version: $MODULE_VERSION"
          if [[ "genai-processors-pydantic $TAG_VERSION" != "$MODULE_VERSION" ]]; then exit 1; fi
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV

      - name: Build Package
        run: uv build

      - name: Publish to PyPi
        run: uv publish || exit $EXIT_ON_PUBLISH_FAILURE

      - name: Release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe  # v2.4.2
        with:
          discussion_category_name: announcements
          generate_release_notes: true
          files: |
            dist/genai_processors_pydantic-${{env.TAG_VERSION}}.tar.gz
            dist/genai_processors_pydantic-${{env.TAG_VERSION}}-py3-none-any.whl
